; Quantity of active players (change in-game with 1,2,3,4 keys)
PlayerCount = 1

; 1 = Bilinear filter, 0 = Nearest-neighbour filter
LinearFilter = 0

; 1 = Smooth interpolated rendering, 0 = Original 25 fps look (toggle in-game with F10)
Interpolate = 0

; 1 = Realtime follow-cam scrolling, 0 = Original paused-batch scroll
RealtimeScroll = 1

; Scale multiplier for graphics and window
Scale = 3

; Overall sound volume
Volume = 5

; Colour hue shift for each player's hat
HueShift0 = 0
HueShift1 = 175
HueShift2 = 255
HueShift3 = 60

; Player xinput/Xbox controller mappings
XinputPlayer0 = 0
XinputPlayer1 = 1
XinputPlayer2 = 2
XinputPlayer3 = 3

