; Per-player keyboard bindings for P0..P2 (Windows Virtual-Key codes in decimal).
; Default controls:
; Player0 = Directional keys + Space
; Player1 = WASD + Shift
; Player2 = IJKL + Return

; 0 disables a binding. Common codes: Up=38 Down=40 Left=37 Right=39 Space=32
; Enter=13 LShift=160 RShift=161 Tab=9 Esc=27 Letters: 'A'=65..'Z'=90 Digits: '0'=48..'9'=57
; https://learn.microsoft.com/en-us/windows/win32/inputdev/virtual-key-codes
KeyP0Up = 38
KeyP0Down = 40
KeyP0Left = 37
KeyP0Right = 39
KeyP0Action = 32
KeyP1Up = 87
KeyP1Down = 83
KeyP1Left = 65
KeyP1Right = 68
KeyP1Action = 160
KeyP2Up = 73
KeyP2Down = 75
KeyP2Left = 74
KeyP2Right = 76
KeyP2Action = 13

