; Quantity of active players (change in-game with 1..8 keys)
PlayerCount = 1

; 1 = Bilinear filter, 0 = Nearest-neighbour filter
LinearFilter = 0

; 1 = Smooth interpolated rendering, 0 = Original 25 fps look (toggle in-game with F10)
Interpolate = 1

; Scale multiplier for graphics and window
Scale = 3

; Overall sound volume
Volume = 5

; Colour hue shift for each player's hat
HueShift0 = 0
HueShift1 = 175
HueShift2 = 255
HueShift3 = 60
HueShift4 = 220
HueShift5 = 300
HueShift6 = 30
HueShift7 = 330

; Player xinput/Xbox controller mappings (-1 disables, 0..3 selects XInput slot)
XinputPlayer0 = 0
XinputPlayer1 = 1
XinputPlayer2 = 2
XinputPlayer3 = 3
XinputPlayer4 = -1
XinputPlayer5 = -1
XinputPlayer6 = -1
XinputPlayer7 = -1

; Player DirectInput controller mappings (-1 disables, 0..3 selects DI device slot
DinputPlayer0 = -1
DinputPlayer1 = -1
DinputPlayer2 = -1
DinputPlayer3 = -1
DinputPlayer4 = -1
DinputPlayer5 = -1
DinputPlayer6 = -1
DinputPlayer7 = -1

; Per-player gamepad face-button mapping: 1 = smart (A=jump, B=stick, X=shoot, Y=bomb), 0 = generic (all face buttons act as fire, like keyboard)
SmartPadMapping0 = 1
SmartPadMapping1 = 1
SmartPadMapping2 = 1
SmartPadMapping3 = 1
SmartPadMapping4 = 1
SmartPadMapping5 = 1
SmartPadMapping6 = 1
SmartPadMapping7 = 1

; 1 = Atomic shift + camera catch-up (gameplay never pauses), 0 = Original 8-tick paused scroll (toggle in-game with F11)
RealtimeScroll = 0

; Number of ticks the camera takes to visually catch up after a real-time scroll (1..30)
ScrollCatchupFrames = 8

; 1 = Fix legacy bug where falling fast could cause a brief mid-air landing just before the ground, 0 = Original behaviour
FixFallLanding = 0

; 1 = ignore Up direction from this player's XInput pad (dpad + stick); 0 = enabled
XinputDisableUp0 = 0
XinputDisableUp1 = 0
XinputDisableUp2 = 0
XinputDisableUp3 = 0
XinputDisableUp4 = 0
XinputDisableUp5 = 0
XinputDisableUp6 = 0
XinputDisableUp7 = 0

; 1 = ignore Up direction from this player's DirectInput pad (dpad + stick); 0 = enabled
DinputDisableUp0 = 0
DinputDisableUp1 = 0
DinputDisableUp2 = 0
DinputDisableUp3 = 0
DinputDisableUp4 = 0
DinputDisableUp5 = 0
DinputDisableUp6 = 0
DinputDisableUp7 = 0

